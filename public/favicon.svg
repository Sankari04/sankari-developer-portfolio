<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0D0D12" stroke="url(#grad)" stroke-width="2" />
  <circle cx="32" cy="32" r="24" fill="#A855F7" fill-opacity="0.1" />
  <!-- Letter S with code brackets -->
  <path d="M19 22L12 32L19 42" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 22L52 32L45 42" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="38" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" filter="url(#glow)">S</text>
</svg>
